steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-east2-docker.pkg.dev/ace-prep-496408/optiloc/optiloc-api:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-east2-docker.pkg.dev/ace-prep-496408/optiloc/optiloc-api:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - optiloc-api
      - --image=asia-east2-docker.pkg.dev/ace-prep-496408/optiloc/optiloc-api:$COMMIT_SHA
      - --region=asia-east2
      - --platform=managed
      - --allow-unauthenticated
      - --max-instances=3
      - --port=8000

options:
  logging: CLOUD_LOGGING_ONLY